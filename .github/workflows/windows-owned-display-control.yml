name: Experimental Windows owned display control

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-virtual-display-prototype]
    paths:
      - 'experiments/windows-virtual-display/ExperimentCIContext.ps1'
      - 'experiments/windows-virtual-display/Test-ExperimentCIContext.ps1'
      - 'experiments/windows-virtual-display/OwnedDisplayControl.h'
      - 'experiments/windows-virtual-display/OwnedDisplayControl.cpp'
      - 'experiments/windows-virtual-display/OwnedDisplayControlTests.cpp'
      - 'experiments/windows-virtual-display/ReviewOpsOwnedControl.vcxproj'
      - 'experiments/windows-virtual-display/ReviewOpsOwnedControlTests.vcxproj'
      - 'experiments/windows-virtual-display/Build-OwnedDisplayControl.ps1'
      - 'experiments/windows-virtual-display/ControlProtocol.h'
      - 'experiments/windows-virtual-display/PackageAdmission.h'
      - 'experiments/windows-virtual-display/PackageAdmission.cpp'
      - 'experiments/windows-virtual-display/PackageStaging.h'
      - 'experiments/windows-virtual-display/PackageStaging.cpp'
      - 'experiments/windows-virtual-display/PackageInstall.h'
      - 'experiments/windows-virtual-display/PackageInstall.cpp'
      - 'experiments/windows-virtual-display/OwnedSoftwareDevice.h'
      - 'experiments/windows-virtual-display/OwnedSoftwareDevice.cpp'
      - 'experiments/windows-virtual-display/Directory.Build.props'
      - 'experiments/windows-virtual-display/packages.config'
      - '.github/workflows/windows-owned-display-control.yml'

permissions:
  contents: read

concurrency:
  group: windows-owned-display-control
  cancel-in-progress: false

jobs:
  control:
    if: github.repository == 'season-framework/reviewops-local' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/windows-virtual-display-prototype') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    env:
      REVIEWOPS_MANUAL_DISPLAY_PROBE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check explicit CI admission without native effects
        shell: pwsh
        run: ./experiments/windows-virtual-display/Test-ExperimentCIContext.ps1
      - name: Compile owned control and test without native device I/O
        shell: pwsh
        run: ./experiments/windows-virtual-display/Build-OwnedDisplayControl.ps1
      - name: Preserve control component evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-windows-owned-display-control
          path: |
            experiments/windows-virtual-display/_out/owned-control-components-build.json
            experiments/windows-virtual-display/_out/owned-control-components-*.log
            experiments/windows-virtual-display/_out/owned-control/*.exe
            experiments/windows-virtual-display/_out/owned-control/*.lib
          retention-days: 7
          if-no-files-found: warn
