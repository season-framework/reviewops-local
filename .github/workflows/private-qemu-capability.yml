name: Private QEMU capability observation

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed six-path harness commit and workflow source
        type: string
        required: true
      parent_control_json:
        description: Root conditional authority with exact run number and six source pins
        type: string
        required: true
      whole_supply_proof_json:
        description: Exact verbatim 3336-byte Root R3 whole-supply acceptance JSON
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: reviewops-private-qemu-capability
  cancel-in-progress: false

jobs:
  capability:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/issue34-private-qemu-capability' && github.sha == inputs.reviewed_commit && github.actor_id == 351100875 && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.reviewed_commit }}
      - name: Retain exact conditional inputs without shell interpolation
        env:
          CAPABILITY_PARENT_JSON: ${{ inputs.parent_control_json }}
          CAPABILITY_WHOLE_JSON: ${{ inputs.whole_supply_proof_json }}
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'r34-capability-control'
          root.mkdir(mode=0o700)
          for name, variable in [('parent.json', 'CAPABILITY_PARENT_JSON'),
                                 ('whole-proof.original.json', 'CAPABILITY_WHOLE_JSON')]:
              raw = os.environ[variable].encode('utf-8')
              if not 0 < len(raw) <= 65536:
                  raise ValueError('Bounded control input required')
              with (root / name).open('xb') as stream:
                  stream.write(raw)
          Path('test-results').mkdir()
          PY
      - name: Observe one private derivative under the exact conditional authority
        env:
          REVIEWOPS_ARTIFACT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I -B scripts/diagnostics/private-qemu-capability.py \
            --parent "$RUNNER_TEMP/r34-capability-control/parent.json" \
            --whole-proof "$RUNNER_TEMP/r34-capability-control/whole-proof.original.json" \
            --output "$GITHUB_WORKSPACE/test-results/private-qemu-capability-orchestrator"
      - name: Retain sanitized observations and original process receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-private-qemu-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/private-qemu-capability-orchestrator/*.json
            test-results/private-qemu-capability-orchestrator/*.stdout
            test-results/private-qemu-capability-orchestrator/*.stderr
            test-results/private-qemu-runtime-*/*.json
            test-results/private-qemu-runtime-*/*.stdout
            test-results/private-qemu-runtime-*/*.stderr
          if-no-files-found: warn
          retention-days: 14
