name: Stable release draft
run-name: Stable draft ${{ inputs.release_version }} from ${{ inputs.reviewed_commit }}

# The chat's 04:00 Asia/Seoul heartbeat selects an explicit version and dispatches
# this workflow after its version commit has been reviewed and merged to main.
# It intentionally has no second schedule and never publishes a Release.
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full reviewed SHA currently on main, including the version commit
        type: string
        required: true
      release_version:
        description: Stable semantic version matching package.json and release-plan.json
        type: string
        required: true
      deliver_to_draft:
        description: Deliver all verified packages to a stable draft; never publish
        type: boolean
        required: false
        default: false

permissions:
  contents: read
concurrency:
  group: reviewops-stable-release
  cancel-in-progress: false

env:
  REVIEWOPS_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
  REVIEWOPS_RELEASE_TAG: v${{ inputs.release_version }}
  REVIEWOPS_DELIVER_TO_DRAFT: ${{ inputs.deliver_to_draft }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Match reviewed main, explicit version policy, and previous stable release
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/stable-release.mjs check
          node --input-type=module -e 'import fs from "node:fs"; fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${process.env.GITHUB_SHA}\n`);'

  package:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            arch: x64
          - target: win32-x64
            runner: windows-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Select the native fixture .NET installation directory
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ProgramFiles)) { throw 'ProgramFiles is required for the native fixture SDK.' }
          $fixtureDotnetDirectory = Join-Path $env:ProgramFiles 'dotnet'
          "DOTNET_INSTALL_DIR=$fixtureDotnetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up the pinned native fixture .NET SDK
        if: matrix.target == 'win32-x64'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.426'
          architecture: x64
          cache: false
      - run: npm ci
      - name: Test MCP connection identity and QA contracts on every native target
        run: node --test --test-concurrency=1 --test-timeout=90000 --test-reporter=tap tests/tool-integration.test.cjs tests/mcp-server.test.cjs tests/qa-automation.test.cjs tests/qa-connection-status.test.cjs
      - name: Test stable and existing publication contracts on every native platform
        run: node --test tests/stable-release.test.cjs tests/windows-release-upload.test.cjs tests/test-release.test.cjs tests/test-updates.test.cjs
      - name: Run the full existing suite on macOS arm64
        if: matrix.target == 'darwin-arm64'
        run: node --test --test-concurrency=1 --test-timeout=90000 tests/*.test.cjs
      - name: Package and verify the matching native operating system and CPU
        env:
          STABLE_TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/stable-build.mjs --target "$STABLE_TARGET"
      - name: Clear generated test identity after any build result
        if: always()
        run: node scripts/build-info.mjs --clear
      - name: Keep verified packages and their source-bound reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-stable-${{ matrix.target }}
          path: |
            release/stable-${{ matrix.target }}/*.zip
            release/stable-${{ matrix.target }}/*.dmg
            release/stable-${{ matrix.target }}/*.exe
            release/stable-${{ matrix.target }}/verification-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Keep native verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-stable-diagnostics-${{ matrix.target }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: reviewops-stable-darwin-*
          merge-multiple: true
          path: release/stable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: reviewops-stable-win32-x64
          path: release/stable
      - name: Refuse stale main and collect only the complete matching package set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/stable-release.mjs check
          node scripts/stable-release.mjs collect --directory release/stable
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-stable-delivery
          path: release/stable/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    if: inputs.deliver_to_draft == true
    needs: [metadata, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: reviewops-stable-delivery
          path: release/stable
      - name: Upload to a matching stable draft without publication or replacement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stable-release.mjs deliver --directory release/stable --deliver-to-draft
