name: Test build

on:
  push:
    branches:
      - codex/test-updates
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build to the single test-latest prerelease
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One global lock, across every branch and rerun. Keep it until cleanup ends.
# Pending older runs may be replaced. Running publications are never cancelled.
concurrency:
  group: reviewops-test-latest
  cancel-in-progress: false

env:
  REVIEWOPS_PUBLICATION_GROUP: reviewops-test-latest

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      issues: read
    outputs:
      number: ${{ steps.info.outputs.number }}
      development_number: ${{ steps.info.outputs.development_number }}
      built_at: ${{ steps.info.outputs.built_at }}
      base_commit: ${{ steps.info.outputs.base_commit }}
      context_sha: ${{ steps.info.outputs.context_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: info
        name: Assign one development identity to all packages under the global lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWOPS_TEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        shell: bash
        run: node scripts/test-development-metadata.mjs
      - name: Preserve this build's frozen change notes and verified references
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-test-build-context
          path: release/test-context/build-context.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            node_arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            node_arch: x64
          - target: win32-x64
            runner: windows-latest
            node_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - name: Select the native fixture .NET installation directory
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ProgramFiles)) { throw 'ProgramFiles is required for the native fixture SDK.' }
          $fixtureDotnetDirectory = Join-Path $env:ProgramFiles 'dotnet'
          "DOTNET_INSTALL_DIR=$fixtureDotnetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up the pinned native fixture .NET SDK
        if: matrix.target == 'win32-x64'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.426'
          architecture: x64
          cache: false
      - run: npm ci
      - name: Test publication and updater contracts
        run: node --test tests/test-release.test.cjs tests/test-updates.test.cjs tests/test-development-release.test.cjs tests/test-development-version.test.cjs tests/test-release-references.test.cjs tests/test-build-context.test.cjs
      - name: Test existing updater contracts on Intel macOS
        if: matrix.target == 'darwin-x64'
        run: node --test tests/updates.test.cjs
      - name: Run existing macOS unit tests
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=4 --test-timeout=90000 tests/*.test.cjs > "$RUNNER_TEMP/reviewops-unit-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/reviewops-unit-tests.log"
          if [ "$result" -ne 0 ]; then
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const log = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'reviewops-unit-tests.log'), 'utf8');
          const match = /(?:^not ok |\ntest at )/m.exec(log);
          const detail = match ? log.slice(match.index, match.index + 5000) : log.slice(-5000);
          console.log('::error title=macOS unit tests::' + detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          JS
          fi
          exit "$result"
      - name: Build the reviewed renderer without regenerating platform notices
        timeout-minutes: 4
        run: node --input-type=module -e "import {buildRenderer} from './scripts/test-build.mjs'; import {recordNativeRenderer} from './scripts/native-packet.mjs'; await buildRenderer({generateLicenses:false}); await recordNativeRenderer({repository:process.cwd(),source:process.env.GITHUB_SHA});"
      - name: Verify shared web capture and QA recovery on each native target
        timeout-minutes: 10
        env:
          REVIEWOPS_CAPTURE_DIAGNOSTICS: '1'
          REVIEWOPS_CAPTURE_POSTFAILURE_PROBE: '1'
        shell: bash
        run: |
          node --test tests/session-capture-diagnostics.test.mjs tests/session-capture-failure-order.test.mjs tests/native-owned-evidence.test.mjs
          node scripts/e2e-live-web-sessions.mjs
          node scripts/e2e-qa-viewer-sessions.mjs
      - name: Verify public MCP category requests on native macOS
        if: matrix.target == 'darwin-arm64'
        run: node scripts/e2e-mcp-review-categories.mjs
      - name: Verify native owned service and preserved panel/concurrent regressions
        timeout-minutes: 20
        env:
          REVIEWOPS_OWNED_SERVICE_TARGET: ${{ matrix.target }}
          REVIEWOPS_LIVE_CODEX: '0'
          REVIEWOPS_LIVE_CLAUDE: ''
        shell: bash
        run: node scripts/owned-native-orchestration.mjs source --target "$REVIEWOPS_OWNED_SERVICE_TARGET" --source "$GITHUB_SHA"
      - name: Package and verify the native target
        env:
          TEST_BUILD_NUMBER: ${{ needs.metadata.outputs.number }}
          TEST_DEVELOPMENT_NUMBER: ${{ needs.metadata.outputs.development_number }}
          TEST_BUILT_AT: ${{ needs.metadata.outputs.built_at }}
          TEST_TARGET: ${{ matrix.target }}
        run: node scripts/test-build.mjs package --target "$TEST_TARGET" --number "$TEST_BUILD_NUMBER" --development-number "$TEST_DEVELOPMENT_NUMBER" --commit "$GITHUB_SHA" --built-at "$TEST_BUILT_AT"
        shell: bash
      - name: Clear generated test identity even after a failed build
        if: always()
        run: node scripts/build-info.mjs --clear
      - name: Stage verified packages for the single publication job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-test-build-${{ matrix.target }}
          path: |
            release/test-${{ matrix.target }}/*.zip
            release/test-${{ matrix.target }}/*.dmg
            release/test-${{ matrix.target }}/*.exe
            release/test-${{ matrix.target }}/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Keep native shared-session QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-shared-session-qa-${{ matrix.target }}
          path: |
            test-results/live-web-sessions/
            test-results/qa-viewer-sessions/
          if-no-files-found: warn
          retention-days: 1
      - name: Keep native owned-service and regression evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewops-owned-service-qa-${{ matrix.target }}
          path: |
            test-results/owned-service-native/
          if-no-files-found: warn
          retention-days: 1

  publish:
    if: always()
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Collect this run's verified files only
        if: needs.package.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: reviewops-test-build-*
          merge-multiple: true
          path: release/test
      - name: Validate complete publication without changing any Release
        id: validation
        if: needs.package.result == 'success'
        env:
          TEST_CONTEXT_SHA: ${{ needs.metadata.outputs.context_sha }}
        run: |
          node scripts/test-build-context.mjs --context release/test/build-context.json --directory release/test --expected-sha "$TEST_CONTEXT_SHA"
          node scripts/test-release.mjs --directory release/test --dry-run
      - name: Publish the complete build and remove previous test packages
        id: publication
        if: needs.package.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/test-release.mjs --directory release/test --publish
      - name: Remove temporary package artifacts from this workflow
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP_CURRENT: ${{ needs.metadata.result == 'success' && steps.publication.outcome != 'success' }}
          KEEP_CANDIDATE: ${{ steps.publication.outcome != 'success' }}
        shell: bash
        run: |
          if [ "$KEEP_CURRENT" = "true" ]; then
            node scripts/test-build-artifacts.mjs --delete --keep-current
          elif [ "$KEEP_CANDIDATE" = "true" ]; then
            node scripts/test-build-artifacts.mjs --delete --keep-candidate
          else
            node scripts/test-build-artifacts.mjs --delete
          fi
      - name: Fail when a required package was not verified
        if: needs.metadata.result != 'success' || needs.package.result != 'success'
        run: node -e "process.exit(1)"
